<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}AutoJobApp{% endblock title %}</title>

    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', path='favicon.ico') }}"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', path='base.css') }}"
    />

      <script>
          function closeAlert(){
              const alertContainer = document.getElementById("alert-container");
              const alertBody = document.getElementById("alert-body");
              const alertUrl = document.getElementById("alert-url");

              alertContainer.hidden = true;
              alertBody.innerText = "";
              alertUrl.innerText = "";
          }

          async function sendRequest(url, data) {
              let response = null;
              if(data === undefined){
                  response = await fetch(url);
              } else {
                  response = await fetch(url, data);
              }

              if(response === null){
                  console.log("Response should not be null. There is some error in the code");
              }

              if (!response.ok){
                  const content = await response.json();
                  const alertContainer = document.getElementById("alert-container");
                  const alertBody = document.getElementById("alert-body");
                  const alertUrl = document.getElementById("alert-url");

                  alertBody.innerText = JSON.stringify(content["body"]);
                  alertUrl.innerText = content["url"];
                  alertContainer.hidden = false;

                  return null;
              } else{
                  return response;
              }
          }
      </script>
    {% block styles %}{% endblock styles %}
  </head>
  <body>
    {% if user.id is not none %}
    <nav id="navigation-bar">
      <ul id="nav-links-list">
        <li>
          <a href="{{ url_for('index') }}">Home</a>
        </li>
        <li>
          <a href="{{ url_for('account_details') }}">Account</a>
        </li>
        <li>
          <a href="{{ url_for('logout') }}">Sign out</a>
        </li>
        <!--        <li>-->
        <!--            <a href="{{ url_for('cv_page') }}">View your CV</a>-->
        <!--        </li>-->
        <!--        <li>-->
        <!--            <a href="{{ url_for('load_manage_users_page') }}">Manage users</a>-->
        <!--        </li>-->
      </ul>
    </nav>
    {% endif %}

    <main>{% block content %}{% endblock content %}</main>

    <footer>
      <p>&copy; 2026 AutoJobApp</p>
    </footer>

    <div id="alert-container" hidden="hidden">
        <div>
            <h3>Error message:</h3>
            <p id="alert-body"></p>
        </div>
        <div>
            <h3>Endpoint url/path:</h3>
            <p id="alert-url"></p>
        </div>

        <button onclick="closeAlert()" id="alert-close-btn">Close alert</button>
    </div>

    {% block scripts %}{% endblock scripts %}
  </body>
</html>
